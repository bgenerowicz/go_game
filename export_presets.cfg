; Export presets for go_game (PLAN milestone 9).
;
; Written by hand and checked with `godot --headless --export-presets`, which
; lists the presets this file defines. Opening the project in the editor will
; rewrite and complete the option lists; that is expected and harmless.
;
; WHY THE ENGINE IS NOT IN include_filter
; ---------------------------------------
; KataGo is a separate process. It reads its binary, config and network from the
; real filesystem, so files packed inside the exported .pck are invisible to it
; (and a binary inside a .pck cannot be executed at all). Packing the ~150 MB of
; networks in there would only double the download size. So include_filter stays
; empty and the engine folder is copied next to the exported executable after the
; export, which is exactly where scripts/engine/katago_process.gd looks:
;
;   build/windows/go_game.exe
;   build/windows/engine/analysis.cfg
;   build/windows/engine/models/main.bin.gz
;   build/windows/engine/models/human.bin.gz   (optional)
;   build/windows/engine/win/katago.exe
;
;   build/macos/go_game.app/Contents/MacOS/go_game
;   build/macos/go_game.app/Contents/Resources/engine/analysis.cfg
;   build/macos/go_game.app/Contents/Resources/engine/models/main.bin.gz
;   build/macos/go_game.app/Contents/Resources/engine/models/human.bin.gz
;   build/macos/go_game.app/Contents/Resources/engine/macos/katago
;
; Source for those files and where to put a development checkout instead:
; see tools/README.md. A user who has none of them gets a message naming the
; folders that were searched, and can point the app at them in Settings.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*,runtime/*,local-assets/*,testdata/*,tests/*,tools/*,*.md,*.html"
export_path="build/windows/go_game.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
binary_format/architecture="x86_64"
codesign/enable=false
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name="go_game"
application/file_description="Go board, analysis and review"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false

[preset.1]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*,runtime/*,local-assets/*,testdata/*,tests/*,tools/*,*.md,*.html"
export_path="build/macos/go_game.app"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

binary_format/architecture="universal"
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
application/icon=""
application/icon_interpolation=4
application/bundle_identifier="org.gogame.go-game"
application/signature=""
application/app_category="Games"
application/short_version=""
application/version=""
application/copyright=""
application/copyright_localized=PackedStringArray()
application/export_angle=0
application/display_name="go_game"
display/high_res=true
application/additional_plist_content=""
application/min_macos_version_x86_64="10.13"
application/min_macos_version_arm64="11.00"
codesign/codesign=1
codesign/identity=""
codesign/certificate_file=""
codesign/certificate_password=""
codesign/provisioning_profile=""
codesign/entitlements/custom_file=""
; PLAN section 8: a sandboxed macOS app cannot execute the KataGo binary, so the
; app sandbox stays off. Enable it only if the engine is bundled as a helper
; executable inside the app bundle instead.
codesign/entitlements/app_sandbox/enabled=false
codesign/entitlements/app_sandbox/helper_executables=false
codesign/entitlements/app_sandbox/network_client=false
codesign/entitlements/app_sandbox/network_server=false
codesign/entitlements/app_sandbox/files_user_selected=true
codesign/entitlements/app_sandbox/files_downloads=false
codesign/entitlements/app_sandbox/files_pictures=false
codesign/entitlements/app_sandbox/files_movies=false
codesign/entitlements/app_sandbox/files_music=false
codesign/custom_options=PackedStringArray()
notarization/notarization=0
